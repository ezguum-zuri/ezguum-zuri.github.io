<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Envíos internos</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/barcodes/JsBarcode.code128.min.js"></script>
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e5e7eb;--soft:#f1f5f9;
  --pri:#4f46e5;--pri-soft:#eef2ff;--urg:#dc2626;--urg-soft:#fef2f2;
  --c-creado:#64748b;--c-transito:#d97706;--c-recibido:#2563eb;--c-entregado:#16a34a;
  --r:18px;--sh:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  --nav-h:68px;--safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(var(--nav-h) + var(--safe) + 16px)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:var(--pri)}
button{font:inherit;color:inherit}

/* ---- Barra superior ---- */
.top{position:sticky;top:0;z-index:20;background:rgba(245,246,250,.85);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid rgba(0,0,0,.04)}
.top-in{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(79,70,229,.35)}
.logo svg.i{width:20px;height:20px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.tr{margin-left:auto;display:flex;gap:6px;align-items:center}
.rol{font-size:12px;font-weight:700;padding:6px 12px;border-radius:14px;background:var(--ink);color:#fff;max-width:min(52vw,340px);line-height:1.2;text-align:center}
.rol small{display:block;font-weight:500;font-size:11px;opacity:.75}
.rol,.rol small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rol:empty{display:none}
@media(max-width:520px){.brand small{display:none}.brand{font-size:15px}body.con-rol .brand{display:none}.rol{max-width:62vw}}
.rf-btn{width:36px;height:36px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.rf-btn svg.i{width:18px;height:18px}
.rf-btn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;text-decoration:none;white-space:nowrap}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.conn.cloud{background:#dcfce7;color:#15803d}
.conn.local{background:#fef3c7;color:#b45309}
.conn.err{background:#fee2e2;color:#b91c1c}

/* ---- Navegación inferior (móvil) ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe));display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#94a3b8;font-size:11px;font-weight:600;padding:6px 0}
.nav a.on{color:var(--pri)}
.nav a.fab{color:#fff}
.nav a.fab span.b{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,#6366f1,#4338ca);display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(79,70,229,.4);border:4px solid var(--bg)}
.nav a.fab svg.i{width:26px;height:26px}
.nav a.fab em{font-style:normal;color:#94a3b8}
.nav a.fab.on em{color:var(--pri)}
@media(min-width:900px){
  body{padding-bottom:30px}
  .nav{position:sticky;top:61px;bottom:auto;display:flex;justify-content:center;gap:4px;background:var(--bg);border:0;backdrop-filter:none;padding:10px;max-width:none;margin:0}
  .nav a{flex-direction:row;font-size:14px;padding:9px 16px;border-radius:12px;gap:8px;color:var(--mute)}
  .nav a:hover{background:#fff}
  .nav a.on{background:#fff;box-shadow:var(--sh)}
  .nav a.fab span.b{width:auto;height:auto;margin:0;background:none;box-shadow:none;border:0;display:contents}
  .nav a.fab{color:var(--mute)}
  .nav a.fab em{color:inherit}
  .nav a.fab.on{color:var(--pri)}
  .nav a.fab svg.i{width:22px;height:22px}
}

main{max-width:980px;margin:0 auto;padding:18px}
@media(min-width:900px){main{padding-top:4px}}
.h1{font-size:28px;font-weight:800;letter-spacing:-.025em;margin:4px 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card-t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin:0 0 14px}
.num{width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.muted{color:var(--mute);font-size:14px}
.small{font-size:12px;color:var(--mute);word-break:break-all}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}

/* ---- Formularios ---- */
.f{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.f .s2{grid-column:span 2}.f .s4{grid-column:1/-1}
@media(max-width:620px){.f{grid-template-columns:1fr 1fr}.f .s2,.f .s4{grid-column:1/-1}}
label.l{display:block;font-size:13px;font-weight:600;color:#334155;margin:0 0 6px}
label.l i{font-style:normal;font-weight:400;color:var(--mute)}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
input:disabled,textarea:disabled{background:var(--soft);color:var(--mute)}
textarea{min-height:84px;resize:vertical}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:10px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:500;cursor:pointer;transition:.15s}
.pill input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.prio{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prio label{position:relative;cursor:pointer}
.prio input{position:absolute;opacity:0}
.prio span{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;border:1.5px solid var(--line);font-weight:600;transition:.15s}
.prio input:checked+span{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.prio input[value=urgente]:checked+span{border-color:var(--urg);background:var(--urg-soft);color:var(--urg)}
.stepperN{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.stepperN button{width:48px;height:48px;border:0;background:var(--soft);font-size:22px;cursor:pointer}
.stepperN input{border:0;text-align:center;border-radius:0;box-shadow:none!important;font-weight:700}
details.more summary{cursor:pointer;color:var(--pri);font-weight:600;font-size:14px;list-style:none;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}

/* ---- Botones ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border:0;border-radius:14px;padding:13px 18px;font-weight:650;font-size:15px;cursor:pointer;background:var(--pri);color:#fff;text-decoration:none;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.big{width:100%;padding:17px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.55;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns .btn{flex:1;min-width:140px}
.sticky-go{position:sticky;bottom:calc(var(--nav-h) + var(--safe) + 8px);z-index:10;margin-top:6px}
.sticky-go .btn{box-shadow:0 10px 24px rgba(79,70,229,.35)}
@media(min-width:900px){.sticky-go{bottom:16px}}

/* ---- Inicio ---- */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.act{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:var(--r);text-decoration:none;color:#fff;min-height:150px;box-shadow:var(--sh);position:relative;overflow:hidden}
.act::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.act.a1{background:linear-gradient(140deg,#6366f1,#4338ca)}
.act.a2{background:linear-gradient(140deg,#0f172a,#334155)}
.act .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.act b{font-size:19px;letter-spacing:-.01em}
.act small{display:block;opacity:.8;font-size:13px;font-weight:500;margin-top:2px}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;counter-reset:h}
.how div{text-align:center;font-size:12px;color:var(--mute);line-height:1.25}
.how .d{width:44px;height:44px;border-radius:14px;margin:0 auto 8px;display:grid;place-items:center;color:#fff}
.how b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
@media(max-width:620px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh);border:0;text-align:left;cursor:pointer}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--c)}
.stat span{font-size:13px;color:var(--mute);font-weight:600}

/* ---- Estados ---- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.urg{--c:var(--urg)}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;padding:0;margin:20px 0 4px}
.stepper li{position:relative;text-align:center;font-size:12px;color:var(--mute);padding:0 2px}
.stepper li::before{content:"";position:absolute;top:20px;right:50%;width:100%;height:3px;background:var(--line);z-index:0}
.stepper li:first-child::before{display:none}
.stepper li.done::before{background:var(--c)}
.stepper .dot{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:#fff;border:2px solid var(--line);color:#cbd5e1}
.stepper .dot svg.i{width:20px;height:20px}
.stepper li.done .dot{background:var(--c);border-color:var(--c);color:#fff}
.stepper li.next .dot{border:2px dashed var(--c);color:var(--c);animation:pulse 1.8s infinite}
.stepper b{display:block;font-size:13px;color:#94a3b8;font-weight:600}
.stepper li.done b,.stepper li.next b{color:var(--ink)}
.stepper small{display:block;font-size:11px;margin-top:1px;min-height:14px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 35%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.mini span{height:5px;border-radius:9px;background:var(--line)}
.mini span.on{background:var(--c)}

/* ---- Ficha ---- */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mute);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:10px}
.hero{border-top:5px solid var(--c)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.idm{font:700 15px ui-monospace,"SF Mono",Menlo,monospace;color:var(--mute);letter-spacing:.02em}
.frase{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:12px 0 0;line-height:1.3}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:14px}
.route small{display:block;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.route b{display:block;font-size:15px}
.route span{font-size:13px;color:var(--mute)}
.route .arr{color:#94a3b8}
.route div:last-child{text-align:right}
.next-card{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 5%,#fff)}
.next-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.next-ic{width:52px;height:52px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.next-ic svg.i{width:26px;height:26px}
.next-head small{display:block;font-size:12px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.next-head b{display:block;font-size:20px;letter-spacing:-.015em}
.next-head p{margin:2px 0 0;color:var(--mute);font-size:14px}
.next-card .btn.big{background:var(--c);box-shadow:0 10px 22px color-mix(in srgb,var(--c) 35%,transparent)}
.fields{display:grid;gap:12px;margin-bottom:14px}
.done-card{text-align:center;background:linear-gradient(140deg,#16a34a,#15803d);color:#fff}
.done-card .ic{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto 8px}
.done-card .ic svg.i{width:32px;height:32px;stroke-width:3}
.ok-banner{display:flex;gap:12px;align-items:center;background:#dcfce7;color:#14532d;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-weight:600}
.ok-banner .ic{width:36px;height:36px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;flex:none}
.warn{display:flex;gap:10px;background:#fef3c7;color:#92400e;border-radius:12px;padding:12px;font-size:13px;font-weight:500;margin-top:12px}
.sig{width:100%;height:160px;border:1.5px dashed #cbd5e1;border-radius:12px;background:#fff;touch-action:none;display:block}
.sig-w{position:relative}
.sig-w .btn{position:absolute;right:8px;top:8px;padding:6px 10px;font-size:12px;border-radius:9px}
.sig-w .ph{position:absolute;inset:0;display:grid;place-items:center;color:#cbd5e1;pointer-events:none;font-size:14px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:36px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .d{width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:grid;place-items:center}
.tl .d svg.i{width:18px;height:18px}
.tl b{font-size:15px}
.tl .t{font-size:13px;color:var(--mute)}
.tl img{max-width:220px;width:100%;border:1px solid var(--line);border-radius:10px;margin-top:6px;background:#fff}
dl.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;margin:0;font-size:15px}
dl.kv dt{color:var(--mute);font-size:14px}
dl.kv dd{margin:0;font-weight:500}
details.box>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"›";font-size:26px;color:var(--mute);transform:rotate(90deg);transition:.2s;line-height:1}
details.box[open]>summary::after{transform:rotate(-90deg)}
details.box[open]>summary{margin-bottom:14px}

/* ---- Lista ---- */
.search{position:relative;margin-bottom:12px}
.search svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;width:20px;height:20px}
.search input{padding-left:44px;background:#fff;border-color:transparent;box-shadow:var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#fff;border-radius:99px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--sh);color:#334155}
.chip i{font-style:normal;color:var(--mute);font-weight:500;margin-left:4px}
.chip.on{background:var(--ink);color:#fff}
.chip.on i{color:#cbd5e1}
.item{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh);transition:transform .1s}
.item:active{transform:scale(.99)}
.item .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .r2{font-weight:650;font-size:16px;margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .r2 svg.i{width:16px;height:16px;color:#94a3b8}
.item .r3{font-size:13px;color:var(--mute);margin-top:2px}
.item.urg{box-shadow:inset 4px 0 0 var(--urg),var(--sh)}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.empty .ic{width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;margin:0 auto 12px;box-shadow:var(--sh);color:#94a3b8}

/* ---- Escáner ---- */
.scan{position:relative;border-radius:24px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:62vh;margin:0 auto 14px;width:100%;max-width:520px}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .frame{position:absolute;inset:18%;border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan .frame::before,.scan .frame::after{content:"";position:absolute;inset:-3px;border:4px solid #fff;border-radius:24px;clip-path:polygon(0 0,28% 0,28% 4px,4px 4px,4px 28%,0 28%,0 72%,4px 72%,4px calc(100% - 4px),28% calc(100% - 4px),28% 100%,72% 100%,72% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 72%,100% 72%,100% 28%,calc(100% - 4px) 28%,calc(100% - 4px) 4px,72% 4px,72% 0,100% 0,100% 100%,0 100%)}
.scan .frame::after{display:none}
.scan .line{position:absolute;left:20%;right:20%;height:2px;background:#818cf8;box-shadow:0 0 12px #818cf8;top:20%;animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%,100%{top:20%}50%{top:80%}}
.scan .st{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.row-in{display:flex;gap:8px}
.row-in input{font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}

/* ---- Toast ---- */
.info-card{display:flex;gap:14px;align-items:center}
.info-card .ic{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--mute);display:grid;place-items:center;flex:none}
.info-card b{font-size:16px}
.created{background:#dcfce7;box-shadow:none;color:#14532d}
.created .h{display:flex;gap:12px;align-items:center;font-size:18px;font-weight:700}
.created .h span{width:36px;height:36px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;flex:none}
.code-big{font:800 26px ui-monospace,Menlo,monospace;letter-spacing:.02em;background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;display:inline-block;margin:6px 0 10px}
.follow{margin-top:12px}
.follow .btn{width:100%}
.btn.on-star svg.i{fill:currentColor}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#15803d;background:#dcfce7;padding:6px 10px;border-radius:99px}

/* =====================================================================

const CONFIG_FIJA = {

                      // Sin ningún PIN, cualquier aparato puede hacerlo todo.
  firebase:  {     // Proyecto de PRUEBAS (envios-pruebas). La empresa pondrá aquí el suyo.

    authDomain: "envios-pruebas.firebaseapp.com",

    storageBucket: "envios-pruebas.firebasestorage.app",
    messagingSenderId: "50762282732",
    appId: "1:50762282732:web:477ec2fd3faec1ad0f57c9"
  }
                   // Pegar aquí el objeto firebaseConfig de Firebase. Ej.:
                   // { apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." }
};
/* ===================================================================== */

/* ===== Iconos ===== */
const IC = {

  plus:'<path d="M12 5v14M5 12h14"/>',

  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  cog:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  package:'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',
  truck:'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2M15 18H9M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  building:'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"/>',

  check:'<path d="M20 6 9 17l-5-5"/>',
  printer:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>',
  back:'<path d="m15 18-6-6 6-6"/>',

  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24">${IC[n] || ''}</svg>`;

/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ alert('No se pudo guardar en este dispositivo: ' + e.message); } }
};
const fmt = ts => new Date(ts).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const hora = ts => new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const corto = ts => { const d = new Date(ts), h = new Date(); return d.toDateString() === h.toDateString() ? hora(ts) : d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}) + ' ' + hora(ts); };
const fmtId = (y, n) => `ENV-${y}-${String(n).padStart(6,'0')}`;
const lugar = o => [o.sede, o.edificio ? 'Edif. ' + o.edificio : '', o.punto, o.planta ? 'Pl. ' + o.planta : ''].filter(Boolean).join(' · ');
const donde = o => [o.sede, o.edificio, o.punto].filter(Boolean).join(' · ');
let toastT; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ===== Configuración ===== */
const DEF = { empresa:'Envíos internos', baseUrl:'', sedes:['Zamudio','Ortuella'], edificios:['106','108','Ballonti'], puestos:['Zamudio · 106','Zamudio · 108','Ortuella · Ballonti'], etiqueta:'100x70', firebase:'', usuario:'', pin:'', pinAdmin:'' };
const FIJO = {};
if(CONFIG_FIJA.empresa) FIJO.empresa = CONFIG_FIJA.empresa;
if(CONFIG_FIJA.baseUrl) FIJO.baseUrl = CONFIG_FIJA.baseUrl;
if(CONFIG_FIJA.sedes && CONFIG_FIJA.sedes.length) FIJO.sedes = CONFIG_FIJA.sedes;
if(CONFIG_FIJA.edificios && CONFIG_FIJA.edificios.length) FIJO.edificios = CONFIG_FIJA.edificios;
if(CONFIG_FIJA.pinAlmacen) FIJO.pin = String(CONFIG_FIJA.pinAlmacen);
if(CONFIG_FIJA.pinAdmin) FIJO.pinAdmin = String(CONFIG_FIJA.pinAdmin);
let cfg = Object.assign({}, DEF, LS.get('env_cfg', {}), FIJO);
const fijo = k => k === 'firebase' ? !!CONFIG_FIJA.firebase : k in FIJO;
const nf = k => fijo(k) ? ' disabled title="Fijado por la empresa"' : '';
const saveCfg = () => LS.set('env_cfg', cfg);
const webReal = () => /^https?:$/.test(location.protocol) && location.origin !== 'null';
const baseUrl = () => cfg.baseUrl ? cfg.baseUrl.trim() : webReal() ? location.origin + location.pathname : 'https://configura-la-direccion-en-ajustes/';
const urlOk = () => !!cfg.baseUrl || webReal();
const urlEnvio = id => { const b = baseUrl(); return b + (b.includes('?') ? '&' : '?') + 'envio=' + encodeURIComponent(id); };

/* ===== Estados y pasos ===== */
const ORDEN = ['creado','transito','recibido','entregado'];
const ESTADOS = {
  creado:   { label:'Pendiente de recogida', paso:'Creado',     icon:'package',   next:'transito' },
  transito: { label:'En tránsito',           paso:'Recogido',   icon:'truck',     next:'recibido' },
  recibido: { label:'En destino',            paso:'En destino', icon:'building',  next:'entregado' },
  entregado:{ label:'Entregado',             paso:'Entregado',  icon:'userCheck', next:null }
};
const PASOS = {
  transito:  { titulo:'Recoger el paquete',       texto:e => `Pulsa cuando el paquete salga de ${donde(e.origen)}.`,                    boton:'Confirmar recogida' },
  recibido:  { titulo:'Recibir en destino',       texto:e => `Pulsa cuando el paquete llegue a ${donde(e.destino)}.`,                   boton:'Confirmar llegada' },
  entregado: { titulo:'Entregar al destinatario', texto:e => `Entrega el paquete a ${e.destino.persona}. Puede firmar en la pantalla.`, boton:'Confirmar entrega' }
};
const col = k => `var(--c-${k})`;

/* ===== Almacenamiento: local o Firebase ===== */
const Local = {
  all(){ return LS.get('env_data', {}); },
  put(e){ const a = this.all(); a[e.id] = e; LS.set('env_data', a); },
  async nextId(){ const y = new Date().getFullYear(); const c = LS.get('env_cnt', {}); c[y] = (c[y] || 0) + 1; LS.set('env_cnt', c); return fmtId(y, c[y]); },
  async save(e){ this.put(e); },
  async get(id){ return this.all()[id] || null; },
  async list(){ return Object.values(this.all()).sort((a,b) => b.creado - a.creado); },
  async update(id, fn){ const e = await this.get(id); if(!e) throw new Error('El envío no existe'); const n = fn(e); this.put(n); return n; },
  watch(ids, cb){ const run = () => { const a = this.all(); cb(ids.map(i => a[i]).filter(Boolean)); }; run();
    const h = ev => { if(ev.key === 'env_data') run(); }; addEventListener('storage', h); return () => removeEventListener('storage', h); }
};
const Cloud = {
  db:null,
  async nextId(){
    const y = new Date().getFullYear();
    const ref = this.db.collection('contadores').doc('envios-' + y);
    const n = await this.db.runTransaction(async t => { const s = await t.get(ref); const n = (s.exists ? s.data().n : 0) + 1; t.set(ref, {n}); return n; });
    return fmtId(y, n);
  },
  async save(e){ await this.db.collection('envios').doc(e.id).set(e); },
  async get(id){ const s = await this.db.collection('envios').doc(id).get(); return s.exists ? s.data() : null; },
  async list(){ const q = await this.db.collection('envios').orderBy('creado','desc').limit(1000).get(); return q.docs.map(d => d.data()); },
  async update(id, fn){
    const ref = this.db.collection('envios').doc(id);
    return this.db.runTransaction(async t => { const s = await t.get(ref); if(!s.exists) throw new Error('El envío no existe'); const n = fn(s.data()); t.set(ref, n); return n; });
  },
  watch(ids, cb){
    if(!ids.length){ cb([]); return () => {}; }
    const m = {}; const fire = () => { if(Object.keys(m).length === ids.length) cb(ids.map(i => m[i]).filter(Boolean)); };
    const us = ids.map(id => this.db.collection('envios').doc(id).onSnapshot(s => { m[id] = s.exists ? s.data() : null; fire(); }, () => { m[id] = null; fire(); }));
    return () => us.forEach(u => u());
  }
};
let Store = Local, modoError = '';

function parseFirebase(txt){
  let s = txt.trim(); const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a < 0 || b < 0) throw new Error('No encuentro el objeto { ... } de configuración');
  s = s.slice(a, b + 1).replace(/'/g, '"').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":').replace(/,\s*}/g, '}');
  const o = JSON.parse(s); if(!o.apiKey || !o.projectId) throw new Error('Faltan apiKey o projectId');
  return o;
}
const loadScript = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); });
let compartida = {};
function aplicarCompartida(){ ['empresa','sedes','edificios','puestos'].forEach(k => { if(compartida[k] && !(k in FIJO)) cfg[k] = compartida[k]; }); cfg.puestos = (cfg.puestos || []).map(fmtPuesto).filter(Boolean); }
async function cargarCompartida(){
  if(Store !== Cloud) return;
  try{ const s = await Cloud.db.collection('config').doc('general').get(); if(s.exists){ compartida = s.data(); aplicarCompartida(); } }catch(_){}
}
async function guardarCompartida(){
  if(Store !== Cloud) return;
  const d = { empresa:cfg.empresa, sedes:cfg.sedes, edificios:cfg.edificios, puestos:cfg.puestos, actualizado:Date.now() };
  await Cloud.db.collection('config').doc('general').set(d); compartida = d;
}
async function initStore(){
  if(!CONFIG_FIJA.firebase && !cfg.firebase.trim()) return;
  try{
    const conf = CONFIG_FIJA.firebase || parseFirebase(cfg.firebase);
    if(!conf.apiKey || !conf.projectId) throw new Error('Faltan apiKey o projectId en la configuración');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    if(!firebase.apps.length) firebase.initializeApp(conf);
    Cloud.db = firebase.firestore(); Store = Cloud;
  }catch(e){ modoError = e.message; }
}
function pintaModo(){
  const c = $('#conn');
  if(modoError){ c.className = 'conn err'; c.textContent = 'Error de conexión'; c.title = modoError; }
  else if(Store === Cloud){ c.className = 'conn cloud'; c.textContent = 'Conectado'; c.title = 'Los envíos se comparten entre todos los dispositivos'; }
  else { c.className = 'conn local'; c.textContent = 'Solo este equipo'; c.title = 'Los envíos solo se guardan en este dispositivo. Conecta Firebase en Ajustes.'; }
  const r = rol(), rc = $('#rol'), nom = (LS.get('env_rol', {}) || {}).nombre;
  rc.innerHTML = hayPin() ? (r === 'admin' ? 'Admin' : r === 'almacen' ? esc(miPuesto()) + (nom ? `<small>${esc(nom)}</small>` : '') : '') : '';
  document.body.classList.toggle('con-rol', !!rc.innerHTML);
  rc.title = r === 'almacen' ? [nom, miPuesto()].filter(Boolean).join(' · ') : '';
  $('#h-emp').textContent = cfg.empresa || 'Envíos internos';
  document.title = (cfg.empresa || 'Envíos') + ' · Envíos internos';
  $('#page-style').textContent = cfg.etiqueta === 'A4' ? '@page{size:A4;margin:10mm}' : '@page{size:100mm 70mm;margin:0}';
}

/* ===== Navegación ===== */
/* Roles: trabajador (crea y consulta) · almacén (con PIN y puesto) · administrador (todo) */
/* Personas: con Firebase, cada persona de almacén/recepción tiene su nombre, sus puestos y su PIN personal.
   El administrador las da de alta, les cambia el PIN o las borra; al hacerlo se les cierra la sesión al momento.
   Mientras no haya ninguna persona dada de alta se sigue usando el PIN común de almacén. */
let USERS = [], SEG = {};

    const listo = { u:false, s:false }; let hecho = false;

const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

function parsePuesto(p){

/* ===== Etiqueta ===== */
function barSvg(text){
  if(!window.JsBarcode) return '';
  try{
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    JsBarcode(svg, text, { format:'CODE128', displayValue:false, margin:0, width:2, height:60, background:'#ffffff' });
    const w = svg.getAttribute('width'), h = svg.getAttribute('height');
    svg.setAttribute('viewBox', `0 0 ${parseFloat(w)} ${parseFloat(h)}`); svg.removeAttribute('width'); svg.removeAttribute('height'); svg.removeAttribute('style');
    svg.setAttribute('preserveAspectRatio', 'none');
    return svg.outerHTML;
  }catch(_){ return ''; }
}
const codBarras = id => id.replace(/-/g, '');   // ENV2026000001: sin guiones, para que cualquier pistola lo escriba bien
function qrSvg(text){ const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:12, scalable:true}); }

function firmaPad(c){
  const W = 600, H = 200; c.width = W; c.height = H;
  const x = c.getContext('2d'); x.lineWidth = 3; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0f172a';
  let on = false, drawn = false;
  const p = ev => { const r = c.getBoundingClientRect(); return [(ev.clientX - r.left) * W / r.width, (ev.clientY - r.top) * H / r.height]; };
  c.onpointerdown = ev => { on = true; c.setPointerCapture(ev.pointerId); x.beginPath(); x.moveTo(...p(ev)); const ph = $('#sig-ph'); if(ph) ph.style.display = 'none'; };
  c.onpointermove = ev => { if(!on) return; x.lineTo(...p(ev)); x.stroke(); drawn = true; };
  c.onpointerup = c.onpointercancel = () => on = false;
  return { clear(){ x.clearRect(0,0,W,H); drawn = false; }, drawn: () => drawn, data: () => c.toDataURL('image/png') };
}

async function vLista(){
  limpiar();

  $('#app').innerHTML = '<div class="empty">Cargando envíos…</div>';
  let todos; try{ todos = await Store.list(); }catch(err){ $('#app').innerHTML = `<div class="card">Error al cargar: ${esc(err.message)}</div>`; return; }
  const cnt = k => k === 'todos' ? todos.length : k === 'activos' ? todos.filter(e => e.estado !== 'entregado').length : k === 'urgentes' ? todos.filter(e => e.prioridad === 'urgente' && e.estado !== 'entregado').length : todos.filter(e => e.estado === k).length;
  const chips = [['activos','En curso'],['urgentes','Urgentes'],['creado','Por recoger'],['transito','En tránsito'],['recibido','En destino'],['entregado','Entregados'],['todos','Todos']];
  $('#app').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px"><div class="h1" style="flex:1">Envíos</div><button class="btn ghost" id="rf" title="Actualizar" style="padding:10px">${icon('refresh')}</button></div>
    <p class="sub">Busca un envío o filtra por estado.</p>
    <div class="search">${icon('search')}<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Código (ej. 5), persona, sede…" value="${esc(filtro.q)}"></div>
    <div class="chips">${chips.map(([k,l]) => `<button class="chip ${filtro.estado === k ? 'on' : ''}" data-k="${k}">${l}<i>${cnt(k)}</i></button>`).join('')}</div>
    <details class="more" style="margin-bottom:12px"><summary>Filtrar por fecha</summary>
      <div class="grid2" style="margin-top:10px"><div><label class="l">Desde</label><input type="date" id="d1" value="${filtro.desde}"></div><div><label class="l">Hasta</label><input type="date" id="d2" value="${filtro.hasta}"></div></div>
    </details>
    <div id="lista"></div>
    <div class="btns" style="margin-top:6px"><button class="btn ghost" id="csv">${icon('download')} Exportar a Excel (CSV)</button></div>`;
  const pinta = () => {
    const q = filtro.q.toLowerCase().trim();
    const d1 = filtro.desde ? new Date(filtro.desde + 'T00:00').getTime() : 0;
    const d2 = filtro.hasta ? new Date(filtro.hasta + 'T23:59:59').getTime() : Infinity;
    const num = /^\d{1,6}$/.test(q) ? Number(q) : null;
    const l = todos.filter(e => {
      if(num !== null) return Number(e.id.slice(-6)) === num;   // número de envío: busca ese envío exacto, en cualquier estado
      if(q){ const t = [e.id, e.origen.persona, e.origen.sede, e.origen.edificio, e.destino.persona, e.destino.sede, e.destino.edificio, e.tipo, e.descripcion, ...e.historial.map(h => h.por + ' ' + (h.receptor || ''))].join(' ').toLowerCase(); return t.includes(q); }  // texto: en todos los estados

      if(ORDEN.includes(filtro.estado) && e.estado !== filtro.estado) return false;
      if(e.fecha < d1 || e.fecha > d2) return false;
      return true;
    }).sort((a,b) => (b.prioridad === 'urgente' && b.estado !== 'entregado') - (a.prioridad === 'urgente' && a.estado !== 'entregado') || b.creado - a.creado);
    window._lista = l;
    document.querySelectorAll('.chip').forEach(c => c.style.opacity = q ? '.45' : '');
    $('#lista').innerHTML = l.length ? l.map(itemHTML).join('')
      : `<div class="empty"><div class="ic">${icon('package')}</div>No hay envíos con este filtro.<br><br><a class="btn" href="#/nuevo">${icon('plus')} Crear envío</a></div>`;
  };
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { filtro.estado = c.dataset.k; filtro.q = ''; $('#q').value = ''; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); pinta(); });
  $('#q').oninput = ev => { filtro.q = ev.target.value; pinta(); };
  $('#q').onkeydown = ev => { if(ev.key !== 'Enter') return; const v = ev.target.value.trim(); const id = idDesde(v) || (/^\d{1,6}$/.test(v) ? fmtId(new Date().getFullYear(), +v) : null); if(id){ ev.preventDefault(); abrirEnvio(id); } };
  $('#d1').onchange = ev => { filtro.desde = ev.target.value; pinta(); };
  $('#d2').onchange = ev => { filtro.hasta = ev.target.value; pinta(); };
  $('#rf').onclick = vLista;
  $('#csv').onclick = () => exportCSV(window._lista || []);
  pinta();
}
function exportCSV(l){
  const f = ts => ts ? fmt(ts) : '';
  const cols = ['ID','Estado','Prioridad','Fecha','Origen sede','Origen edificio','Origen planta','Envía','Destino sede','Destino edificio','Destino planta','Recibe','Tipo','Descripción','Bultos','Recogido','Recogido por','Recibido','Recibido por','Entregado','Entregado a'];
  const rows = l.map(e => { const t = ultimo(e,'transito'), r = ultimo(e,'recibido'), d = ultimo(e,'entregado');
    return [e.id, ESTADOS[e.estado].label, e.prioridad, f(e.fecha), e.origen.sede || '', e.origen.edificio, e.origen.planta, e.origen.persona, e.destino.sede || '', e.destino.edificio, e.destino.planta, e.destino.persona, e.tipo, e.descripcion, e.bultos, f(t.ts), t.por || '', f(r.ts), r.por || '', f(d.ts), d.receptor || '']; });
  const csv = '﻿' + [cols, ...rows].map(r => r.map(v => '"' + String(v ?? '').replace(/"/g,'""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'envios-' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
}

/* ===== Vista: escáner ===== */
let stream = null, raf = 0;
function stopScanner(){ cancelAnimationFrame(raf); if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
function idDesde(txt){
  const t = String(txt || '').trim();
  try{ const u = new URL(t); const v = u.searchParams.get('envio'); if(v) return v.toUpperCase(); }catch(_){}
  // Tolerante con pistolas configuradas con otro teclado (el guion puede llegar como ' o ?)
  const m = t.toUpperCase().match(/ENV\W?(\d{4})\W?(\d{1,6})(?!\d)/); return m ? `ENV-${m[1]}-${m[2].padStart(6, '0')}` : null;
}
function abrirEnvio(id){ const h = '#/envio/' + encodeURIComponent(id); if(location.hash === h) route(); else location.hash = h; }
function vScan(){
  const alm = esAlmacen(), tactil = matchMedia('(pointer:coarse)').matches;
  const manual = `<div class="card"><label class="l">Escribe el número del envío <i>(vale solo el número, ej. 15)</i> o usa la pistola lectora</label>
      <div class="row-in"><input id="mid" inputmode="text" placeholder="Ej.: 15" autocapitalize="characters" autocomplete="off"><button class="btn" id="mgo">${icon('arrow')} Abrir</button></div>
      <p class="muted" style="margin:12px 0 0">Con pistola: dispara al código y se abre el envío. Funciona en cualquier pantalla de la app.${tactil ? ' En el móvil también puedes usar la cámara normal.' : ''}</p></div>`;
  const camara = `<div class="scan" id="scanbox"><video id="v" playsinline muted></video><div class="frame"></div><div class="line"></div><div class="st" id="st">Iniciando cámara…</div></div>`;
  $('#app').innerHTML = `<div class="h1">${alm ? 'Escanear' : 'Consultar envío'}</div><p class="sub">${tactil ? 'Apunta al QR de la etiqueta o escribe el número.' : 'Escribe el número del envío o usa la pistola.'}</p>
    ${tactil ? camara + manual : manual + camara}`;
  $('#mgo').onclick = () => { const v = $('#mid').value.trim(); if(!v) return; const id = idDesde(v) || (/^\d{1,6}$/.test(v) ? fmtId(new Date().getFullYear(), +v) : v.toUpperCase()); stopScanner(); abrirEnvio(id); };
  if(!tactil) $('#mid').focus();
  $('#mid').onkeydown = ev => { if(ev.key === 'Enter') $('#mgo').click(); };
  const sinCamara = () => { const b = $('#scanbox'); if(b) b.remove(); };
  if(!navigator.mediaDevices?.getUserMedia){ sinCamara(); return; }
  const ok = txt => { const id = idDesde(txt); if(!id){ $('#st').textContent = 'Ese QR no es de un envío'; return false; }
    if(navigator.vibrate) navigator.vibrate(80); stopScanner(); abrirEnvio(id); return true; };
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false }).then(async s => {
    stream = s; const v = $('#v'); if(!v){ stopScanner(); return; }
    v.setAttribute('playsinline', ''); v.muted = true; v.srcObject = s;
    try{ await v.play(); }catch(_){}
    $('#st').textContent = 'Buscando código QR…';
    let det = null;
    if('BarcodeDetector' in window){ try{ const f = await BarcodeDetector.getSupportedFormats(); if(f.includes('qr_code')) det = new BarcodeDetector({ formats:['qr_code'] }); }catch(_){} }
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently:true });
    let n = 0, busy = false;
    const tick = async () => {
      if(!stream) return;
      if(!busy && v.readyState >= 2 && v.videoWidth){
        busy = true;
        try{
          if(det){ const r = await det.detect(v); if(r.length && ok(r[0].rawValue)) return; }
          else if(window.jsQR){
            const vw = v.videoWidth, vh = v.videoHeight; let sx, sy, sw, sh, w, h;
            if(n++ % 2 === 0){ const side = Math.min(vw, vh) * .75; sx = (vw - side) / 2; sy = (vh - side) / 2; sw = sh = side; w = h = 640; }  // centro, más ampliado
            else { sx = 0; sy = 0; sw = vw; sh = vh; w = 800; h = Math.round(vh * w / vw); }                                    // imagen completa
            cv.width = w; cv.height = h; cx.drawImage(v, sx, sy, sw, sh, 0, 0, w, h);
            const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts:'attemptBoth' });
            if(r && ok(r.data)) return;
          } else { $('#st').textContent = 'No se pudo cargar el lector. Usa la cámara del móvil o escribe el código.'; return; }
        }catch(_){}
        busy = false;
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
  }).catch(err => {
    if(err.name === 'NotAllowedError'){ if($('#st')) $('#st').textContent = 'Sin permiso para la cámara. Actívalo en los ajustes del navegador.'; }
    else sinCamara();   // equipo sin cámara: solo queda el campo para escribir o la pistola
  });
}

      if(!nombre){ toast('Escribe el nombre'); $('#pf-nom').focus(); return; }
      if(!puestos.length){ toast('Marca al menos un puesto'); return; }
      if((!id || pin) && !/^\d{4,8}$/.test(pin)){ toast('El PIN tiene que tener de 4 a 8 cifras'); $('#pf-pin').focus(); return; }
      if(USERS.some(u => u.id !== id && norm(u.nombre) === norm(nombre))){ toast('Ya hay una persona con ese nombre'); return; }
      const b = $('#pf-ok'); b.disabled = true;
      try{
        const ref = id ? Cloud.db.collection('usuarios').doc(id) : Cloud.db.collection('usuarios').doc();
        const d = { nombre, puestos, actualizado:Date.now() };
        if(!id) d.creado = Date.now();
        if(pin) d.pinHash = await hashPin(ref.id, pin);
        await ref.set(d, { merge:true });
        if(!SEG.modoPersonas) await Cloud.db.collection('config').doc('seguridad').set({ modoPersonas:true }, { merge:true });
        cierra();
        if(pin) alert(`${id ? 'Nuevo PIN' : 'PIN'} de ${nombre}: ${pin}\n\nDáselo en persona. No se puede volver a ver; si lo olvida, cámbialo desde aquí.`);
        else toast('Guardado');
      }catch(err){ alert('No se pudo guardar: ' + err.message); }
      b.disabled = false;
    };
  }
  if($('#seg-adm')) $('#seg-adm').onclick = async () => {
    const p1 = prompt('Nuevo PIN de administrador (de 6 a 8 cifras):'); if(p1 === null) return;
    const pin = p1.replace(/\D/g, '');
    if(!/^\d{6,8}$/.test(pin)){ alert('El PIN de administrador tiene que tener de 6 a 8 cifras.'); return; }
    if(prompt('Repite el nuevo PIN:') !== pin){ alert('No coinciden. No se ha cambiado.'); return; }
    try{
      const h = await hashPin('admin', pin);
      LS.set('env_rol', { rol:'admin', h });
      await Cloud.db.collection('config').doc('seguridad').set({ adminHash:h, adminCambiado:Date.now() }, { merge:true });
      toast('PIN de administrador cambiado');
    }catch(err){ alert('No se pudo cambiar: ' + err.message); }
  };
  if($('#ac-salir')) $('#ac-salir').onclick = () => { LS.set('env_rol', {}); refresco('Has salido'); };
  $('#s-save').onclick = async () => {
    const val = id => { const el = $(id); return el && !el.disabled ? el.value.trim() : null; };
    const lista = id => val(id) === null ? null : val(id).split('\n').map(x => x.trim()).filter(Boolean);
    const fbOld = cfg.firebase;
    cfg.usuario = val('#s-usr') ?? cfg.usuario;
    cfg.etiqueta = $('#s-et').value;
    if(val('#s-emp') !== null) cfg.empresa = val('#s-emp') || 'Envíos internos';
    if(lista('#s-se')) cfg.sedes = lista('#s-se');
    if(lista('#s-ed')) cfg.edificios = lista('#s-ed');
    if($('#pu-list')){
      const filas = [...document.querySelectorAll('#pu-list .pu-row')].map(r => [r.querySelector('.pu-se').value.trim(), r.querySelector('.pu-ed').value.trim(), r.querySelector('.pu-pu').value]).filter(([se]) => se);
      cfg.puestos = filas.map(([se, ed, pu]) => textoPuesto(se, ed, pu));
      // las sedes y edificios nuevos se añaden solos a las sugerencias
      filas.forEach(([se, ed]) => {
        if(!(cfg.sedes || []).some(x => norm(x) === norm(se))) cfg.sedes = [...(cfg.sedes || []), se];
        if(ed && !(cfg.edificios || []).some(x => norm(x) === norm(ed))) cfg.edificios = [...(cfg.edificios || []), ed];
      });
    }
    if(val('#s-url') !== null) cfg.baseUrl = val('#s-url');
    if(val('#s-pin') !== null) cfg.pin = val('#s-pin');
    if(val('#s-pinad') !== null) cfg.pinAdmin = val('#s-pinad');
    const fb = val('#s-fb') ?? cfg.firebase;
    if(fb){ try{ parseFirebase(fb); }catch(err){ alert('La configuración de Firebase no es válida: ' + err.message); return; } }
    cfg.firebase = fb; Object.assign(cfg, FIJO); saveCfg();
    if(adm && $('#pu-list')){ try{ await guardarCompartida(); }catch(err){ alert('Se guardó en este aparato, pero no se pudo compartir: ' + err.message); } }
    if(fb !== fbOld){ location.hash = '#/inicio'; location.reload(); return; }
    refresco('Ajustes guardados');
  };
  if($('#s-exp')) $('#s-exp').onclick = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ envios:LS.get('env_data',{}), contador:LS.get('env_cnt',{}) }, null, 1)], {type:'application/json'}));
    a.download = 'envios-backup.json'; a.click();
  };
  if($('#s-imp')) $('#s-imp').onchange = async ev => {
    try{ const d = JSON.parse(await ev.target.files[0].text()); LS.set('env_data', Object.assign(LS.get('env_data',{}), d.envios || {}));
      const c = LS.get('env_cnt',{}); for(const y in d.contador || {}) c[y] = Math.max(c[y] || 0, d.contador[y]); LS.set('env_cnt', c); toast('Datos importados'); }
    catch(err){ alert('Archivo no válido: ' + err.message); }
  };
}

function pintaPersonas(){
  const box = $('#per-list'); if(!box) return;
  if(usaPersonas()){ if($('#per-warn')) $('#per-warn').remove(); if($('#seg-comun')) $('#seg-comun').textContent = 'Desactivado: cada persona entra con el suyo'; }
  const grupos = (cfg.puestos || []).map(p => [p, USERS.filter(u => (u.puestos || []).includes(p))]);
  const sin = USERS.filter(u => !(u.puestos || []).some(p => (cfg.puestos || []).includes(p)));
  if(sin.length) grupos.push(['Sin puesto válido (revisar)', sin]);
  box.innerHTML = grupos.map(([p, l]) => `<div class="per-g"><div class="per-h"><b>${esc(p)}</b><span class="muted">${l.length} ${l.length === 1 ? 'persona' : 'personas'}</span></div>
    ${l.length ? l.map(u => `<div class="per-row"><div><b>${esc(u.nombre)}</b><span class="t">${u.ultimoAcceso ? 'Último acceso: ' + corto(u.ultimoAcceso) : 'Todavía no ha entrado'}</span></div>
      <button type="button" class="btn ghost sm" data-a="pin" data-id="${esc(u.id)}">Cambiar PIN</button><button type="button" class="btn ghost sm" data-a="ed" data-id="${esc(u.id)}">Editar</button><button type="button" class="btn ghost sm del" data-a="del" data-id="${esc(u.id)}">Borrar</button></div>`).join('')
      : '<div class="t muted" style="font-size:13px;padding:4px 0">Nadie todavía</div>'}</div>`).join('');
}

function filaPuesto(se = '', ed = '', pu = ''){
  return `<div class="pu-row"><input class="pu-se" list="sedes-a" placeholder="Sede" value="${esc(se)}"><input class="pu-ed" placeholder="Edificio" value="${esc(ed)}"><select class="pu-pu"><option value="">Almacén</option><option ${pu ? 'selected' : ''}>Recepción</option></select><button type="button" class="btn ghost pu-del" title="Quitar" aria-label="Quitar">✕</button></div>`;
}

/* ===== Arranque ===== */
document.getElementById('recargar').onclick = ev => { ev.currentTarget.classList.add('spin'); location.reload(); };
(async () => { await initStore(); await cargarCompartida(); await cargarSeguridad(); if(Store === Cloud) marcaAcceso(); cfg.puestos = (cfg.puestos || []).map(fmtPuesto).filter(Boolean); pintaModo(); route(); })();
</script>
